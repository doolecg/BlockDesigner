[versions]
junit = "5.13.4"
assertj = "3.27.6"
jackson = "2.20.0"
lwjgl = "3.4.3"
joml = "1.10.9"
javafx = "26.0.2"
atlantafx = "2.1.0"
ikonli = "12.4.0"
jna = "5.19.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl = { module = "org.lwjgl:lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl" }
joml = { module = "org.joml:joml", version.ref = "joml" }
atlantafx = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-feather = { module = "org.kordamp.ikonli:ikonli-feather-pack", version.ref = "ikonli" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
